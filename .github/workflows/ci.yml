name: CI

on:
  push:
    branches:
      - main
      - jev-tender-finder-audit-contract-20261028
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stroyka_company_context_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stroyka_company_context_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install document sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fonts-dejavu-core
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Compile backend
        run: PYTHONPYCACHEPREFIX=/tmp/stroyka-pycache python -m py_compile backend/main.py backend/config.py backend/db.py backend/__init__.py migrations/env.py migrations/versions/*.py

      - name: Run offline JEV request and evidence tests
        run: >-
          python -B -m unittest -v
          jev_agent.tender_finder.commercial.test_commercial
          jev_agent.tender_finder.commercial.test_bridge
          jev_agent.tender_finder.commercial.test_b2b
          jev_agent.tender_finder.commercial.test_b2b_browser
          jev_agent.tender_finder.commercial.test_documents
          jev_agent.tender_finder.commercial.test_attachment_browser
          jev_agent.tender_finder.commercial.test_platforms
          jev_agent.tender_finder.commercial.test_recipes
          jev_agent.tender_finder.commercial.test_access
          jev_agent.tender_finder.commercial.test_api_listing
          jev_agent.tender_finder.commercial.test_owner_step
          jev_agent.tender_finder.commercial.test_zip_documents
          jev_agent.tender_finder.commercial.test_runtime_config
          jev_agent.tender_finder.commercial.test_startup
          jev_agent.tender_finder.commercial.test_systemd_bootstrap
          jev_agent.tender_finder.commercial.test_prepare_install
          jev_agent.tender_finder.commercial.test_server_preflight
          jev_agent.tender_finder.test_contract
          jev_agent.tender_finder.test_reporting
          jev_agent.tender_finder.test_cli
          jev_agent.tender_finder.test_audit_bridge
          jev_agent.tender_finder.test_compat
          jev_agent.tender_finder.test_cli_result
          jev_agent.tender_finder.test_state
          jev_agent.tender_finder.test_cli_plan
          jev_agent.tender_finder.test_discovery
          jev_agent.tender_finder.test_jobs
          jev_agent.tender_finder.test_invoker
          jev_agent.tender_finder.test_publication
          jev_agent.tender_finder.test_evidence
          jev_agent.tender_finder.test_card_page
          jev_agent.tender_finder.test_pipeline
          jev_agent.tender_finder.test_notification
          jev_agent.tender_finder.test_queue
          jev_agent.tender_finder.test_ingress
          jev_agent.tender_finder.test_settings
          jev_agent.tender_finder.test_runtime
          jev_agent.tender_finder.test_hermes_binding
          jev_agent.tender_finder.test_docker_delivery
          jev_agent.tender_finder.test_admission_broker
          jev_agent.tender_finder.test_startup_tool
          jev_agent.tender_finder.test_host_worker
          jev_agent.tender_finder.test_host_service
          jev_agent.tender_finder.test_broker_service
          jev_agent.tender_finder.test_systemd_bootstrap
          jev_agent.tender_finder.test_prepare_install
          jev_agent.tender_finder.test_source_package
          jev_agent.tender_finder.test_image_pin
          jev_agent.tender_finder.test_container_transfer
          jev_agent.tender_finder.test_standalone_release
          jev_agent.server_runtime.scripts.test_jev_commercial_search_profile
          jev_agent.scripts.test_jev_eis_search
          scripts.test_jev_commercial_search_and_import
          scripts.test_jev_push_commercial_report

      - name: Verify JEV container preservation on isolated Docker
        run: python -B -m scripts.verify_jev_docker_preservation
      - name: Verify native JEV document isolation
        run: python -B -m jev_agent.tender_finder.commercial.verify_document_sandbox
      - name: Verify native JEV systemd socket credentials
        run: sudo python3 -B -m scripts.verify_jev_systemd_credentials
      - name: Run backend tests
        shell: bash
        env:
          STROYKA_DOCUMENT_WORKER_DEBUG: "1"
        run: |
          set -o pipefail
          backend_test_log="$(mktemp)"
          set +e
          PYTHONPYCACHEPREFIX=/tmp/stroyka-pycache python -m unittest discover -s backend -p "test_*.py" -t . 2>&1 | tee "$backend_test_log"
          backend_test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$backend_test_status" -ne 0 ]; then
            python -c 'import re,sys; text=open(sys.argv[1], encoding="utf-8", errors="replace").read(); blocks=re.findall(r"={70}\n(?:ERROR|FAIL):.*?(?=\n={70}|\n-{70}\nRan )", text, re.S); names="\n".join(re.findall(r"^(?:ERROR|FAIL):.*$", text, re.M)); divider="\n"+"-"*70; summary=text[text.rfind(divider):] if divider in text else ""; result=(names+"\n\n"+"\n".join(blocks[-3:])+summary)[-9000:]; print("::error title=Backend test failure::" + result.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$backend_test_log"
            exit "$backend_test_status"
          fi

      - name: Run company-context PostgreSQL isolation tests
        env:
          COMPANY_CONTEXT_RUN_POSTGRES_INTEGRATION: "1"
          COMPANY_CONTEXT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stroyka_company_context_test
        run: PYTHONPYCACHEPREFIX=/tmp/stroyka-pycache python -m unittest backend.features.company_context.test_membership_security_postgres -v

      - name: Run acceptance-to-act PostgreSQL chain
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/run_supplier_catalog_postgres_tests.py \
            backend.features.work_acceptance.test_postgres.WorkAcceptancePostgresTests \
            backend.features.contractor_contract_parties.test_postgres.ContractorContractPartiesPostgresTests

      - name: Run supplier quote and staff access PostgreSQL checks
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/run_supplier_catalog_postgres_tests.py \
            backend.features.supplier_offers.test_response_postgres.SupplierResponsePostgresTests \
            backend.features.supplier_access.test_comparison_chain_postgres.ComparisonChainPostgresTests \
            backend.features.supplier_offers.test_offer_mutation_ledger_postgres.OfferMutationLedgerTests \
            backend.features.supplier_offers.test_offer_mutation_preledger_postgres.OfferMutationPreledgerTests \
            backend.features.staff.test_access_postgres.StaffAccessPostgresTests \
            backend.features.participant_support.test_postgres.ParticipantSupportPostgresTests \
            backend.features.participant_support.test_capabilities_postgres.SupportCapabilitiesPostgresTests \
            backend.features.participant_support.test_login_postgres.SupportLoginPostgresTests \
            backend.features.participant_support.test_security_postgres.SupportSecurityPostgresTests \
            backend.features.participant_support.test_directory_postgres.OrganizationDirectoryPostgresTests \
            backend.features.participant_support.test_connection_preview_postgres.SupplierConnectionPreviewPostgresTests \
            backend.features.participant_support.test_connections_postgres.SupplierConnectionsPostgresTests \
            backend.features.participant_support.test_correction_preview_postgres.SupplierCorrectionPreviewPostgresTests \
            backend.features.participant_support.test_correction_financials_postgres.SupplierCorrectionFinancialsPostgresTests \
            backend.features.participant_support.test_corrections_postgres.SupplierCorrectionsPostgresTests \
            backend.features.participant_support.test_rfq_corrections_postgres.SupplierRfqCorrectionsPostgresTests \
            backend.features.participant_support.test_quote_corrections_postgres.SupplierQuoteCorrectionsPostgresTests \
            backend.features.participant_support.test_issued_access_corrections_postgres.SupplierIssuedAccessCorrectionsPostgresTests \
            backend.features.participant_support.test_history_preview_postgres.SupplierHistoryPreviewPostgresTests \
            backend.features.participant_support.test_history_merge_postgres.SupplierHistoryMergePostgresTests \
            backend.features.participant_support.test_duplicate_merge_postgres.AdminDuplicateMergePostgresTests \
            backend.features.participant_support.test_history_contract_merge_postgres.SupplierHistoryContractMergePostgresTests \
            backend.features.invite_codes.test_supplier_registration_postgres.SupplierRegistrationPostgresTests \
            backend.features.supplier_access.test_company_merge_postgres.CompanyMergePostgresTests \
            backend.features.supplier_access.test_company_directory_postgres.CompanyDirectoryPostgresTests

      - name: Run supplier access correction and packaging merge guards
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/run_supplier_catalog_postgres_tests.py \
            backend.features.participant_support.test_invoice_access_corrections_postgres.SupplierInvoiceAccessCorrectionsPostgresTests \
            backend.features.participant_support.test_contract_access_corrections_postgres.SupplierContractAccessCorrectionsPostgresTests \
            backend.features.participant_support.test_history_merge_server_schema_postgres.ServerSchemaMergeTests \
            backend.features.participant_support.test_packaging_merge_locks_postgres.PackagingMergeLockTests \
            backend.features.material_packaging.test_history_guard_postgres.PackagingDatabaseGuardTests \
            backend.features.material_packaging.test_history_lock_postgres.PackagingWriterLockTests

      - name: Run supplier notification delivery and requester boundaries
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/run_supplier_catalog_postgres_tests.py \
            backend.features.supplier_access.test_email_retry_postgres \
            backend.features.supplier_access.test_email_tenant_isolation_postgres \
            backend.features.supplier_access.test_delivery_evidence_postgres \
            backend.features.supplier_access.test_rfq_requester_snapshot_postgres

      - name: Run supplier document and supply history company boundaries
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/run_supplier_catalog_postgres_tests.py \
            backend.features.supplier_access.test_multicompany_chain \
            backend.features.supplier_payments.test_contract_context_postgres

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify JEV attachment JavaScript streams
        run: python -B -m jev_agent.tender_finder.commercial.verify_attachment_javascript

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Build frontend
        run: |
          frontend_settings="$(bash scripts/resolve-frontend-build-env.sh \
            'WORK_MATERIAL_ACCOUNTING_ENABLED=1 WORK_ACCEPTANCE_ENABLED=1 PARTICIPANT_SUPPORT_ENABLED=1 PARTICIPANT_CONNECTIONS_ENABLED=1 PARTICIPANT_SUPPORT_ACCESS_ENABLED=0' '')"
          mapfile -t build_environment <<< "$frontend_settings"
          env "${build_environment[@]}" npm run build
          printf '%s\n' "$frontend_settings" | python3 scripts/verify-frontend-feature-build.py build
