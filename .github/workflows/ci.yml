name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stroyka_company_context_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stroyka_company_context_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install PDF font dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Compile backend
        run: PYTHONPYCACHEPREFIX=/tmp/stroyka-pycache python -m py_compile backend/main.py backend/config.py backend/db.py backend/__init__.py migrations/env.py migrations/versions/*.py

      - name: Run backend tests
        run: PYTHONPYCACHEPREFIX=/tmp/stroyka-pycache python -m unittest discover -s backend -p "test_*.py" -t .

      - name: Run company-context PostgreSQL isolation tests
        env:
          COMPANY_CONTEXT_RUN_POSTGRES_INTEGRATION: "1"
          COMPANY_CONTEXT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stroyka_company_context_test
        run: PYTHONPYCACHEPREFIX=/tmp/stroyka-pycache python -m unittest backend.features.company_context.test_membership_security_postgres -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Build frontend
        run: npm run build
