# Read-only supply technical comparison deployment fragments.
# Install the two zone declarations inside nginx http {} and the two location
# blocks inside the active stroyka26.pro server {} block. Keep the application
# feature disabled until the exact company canary is approved.

limit_req_zone $binary_remote_addr zone=supply_technical_comparison_limit:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=supply_technical_comparison_conn:10m;

location ~ "^/supply-requests/[1-9][0-9]{0,18}/technical-comparisons/(supplier_offer|supplier_invoice)/[1-9][0-9]{0,18}$" {
    limit_req zone=supply_technical_comparison_limit burst=2 nodelay;
    limit_conn supply_technical_comparison_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 65s;
    error_page 429 = @supply_technical_comparison_429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @supply_technical_comparison_429 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie, X-Company-Id, X-Company-Mode" always;
    add_header Retry-After 10 always;
    return 429 '{"detail":"supply_technical_comparison_busy"}';
}
