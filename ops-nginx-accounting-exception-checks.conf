# Accounting exception review deployment fragments.
# Install the four zone declarations inside nginx http {} and the four location
# blocks inside the active stroyka26.pro server {} block.
# Backend service is expected on 127.0.0.1:8001. Keep the feature disabled
# until a separately approved company canary.

limit_req_zone $binary_remote_addr zone=accounting_exception_review_limit:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=accounting_link_repair_limit:10m rate=12r/m;
limit_conn_zone $server_name zone=accounting_exception_review_conn:10m;
limit_conn_zone $server_name zone=accounting_link_repair_conn:10m;

location = /accounting-exception-checks {
    limit_req zone=accounting_exception_review_limit burst=2 nodelay;
    limit_conn accounting_exception_review_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 45s;
    error_page 429 = @accounting_exception_check_429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /accounting-exception-link-repairs {
    limit_req zone=accounting_link_repair_limit burst=2 nodelay;
    limit_conn accounting_link_repair_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 1k;
    client_body_timeout 5s;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 45s;
    error_page 429 = @accounting_link_repair_429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @accounting_exception_check_429 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie, X-Company-Id, X-Company-Mode" always;
    add_header Retry-After 10 always;
    return 429 '{"detail":"accounting_exception_review_busy"}';
}

location @accounting_link_repair_429 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie, X-Company-Id, X-Company-Mode" always;
    add_header Retry-After 10 always;
    return 429 '{"detail":"accounting_link_repair_busy"}';
}
