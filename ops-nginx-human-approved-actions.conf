# A12 human-approved audit receipt deployment fragments.
# Install zone declarations inside nginx http {} and location blocks inside
# the active stroyka26.pro server {} only after separate production approval.
# Backend service must remain bound to 127.0.0.1:8001.

limit_req_zone $binary_remote_addr zone=human_action_write_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=human_action_history_limit:10m rate=30r/m;
limit_conn_zone $server_name zone=human_action_conn:10m;

location = /human-approved-actions/proposals {
    client_max_body_size 4k;
    limit_req zone=human_action_write_limit burst=2 nodelay;
    limit_conn human_action_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @human_action_429;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 65s;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /human-approved-actions/decisions {
    client_max_body_size 4k;
    limit_req zone=human_action_write_limit burst=2 nodelay;
    limit_conn human_action_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @human_action_429;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 65s;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /human-approved-actions/history {
    limit_req zone=human_action_history_limit burst=5 nodelay;
    limit_conn human_action_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @human_action_429;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @human_action_429 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie" always;
    add_header Retry-After "1" always;
    return 429 '{"detail":"human_action_review_busy"}';
}
