# Stroyka public-site API deployment fragments.
# Install the two zone declarations inside nginx http {} and the location
# blocks inside the active stroyka26.pro server {} block.
# Backend service is expected on 127.0.0.1:8001.
#
# If nginx reports "unknown limit_req zone", either add the limit_req_zone
# declarations from docs/ddos-and-ai-indexing.md to nginx.conf http {},
# or temporarily remove the limit_req lines below.

limit_req_zone $binary_remote_addr zone=warehouse_anomaly_preview_limit:10m rate=6r/m;
limit_conn_zone $server_name zone=warehouse_anomaly_preview_conn:10m;

location = /warehouse-anomaly-previews {
    limit_req zone=warehouse_anomaly_preview_limit burst=1 nodelay;
    limit_conn warehouse_anomaly_preview_conn 1;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 4k;
    proxy_connect_timeout 6s;
    proxy_send_timeout 10s;
    proxy_read_timeout 45s;
    error_page 413 = @warehouse_anomaly_preview_413;
    error_page 429 = @warehouse_anomaly_preview_429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location @warehouse_anomaly_preview_413 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie, X-Company-Id, X-Company-Mode" always;
    return 413 '{"detail":"warehouse_anomaly_preview_request_too_large"}';
}

location @warehouse_anomaly_preview_429 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie, X-Company-Id, X-Company-Mode" always;
    add_header Retry-After 10 always;
    return 429 '{"detail":"warehouse_anomaly_preview_busy"}';
}

